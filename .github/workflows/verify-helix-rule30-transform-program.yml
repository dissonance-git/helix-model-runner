name: Verify Helix Rule30 transform program

on:
  push:
    paths:
      - '.github/workflows/verify-helix-rule30-transform-program.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify mirrored canonical inputs
        shell: bash
        run: |
          set -euo pipefail
          cd verification/helix-7ba5a58a
          test "$(git rev-parse HEAD >/dev/null; echo yes)" = "yes"
          python -m py_compile             engine/ir/passes.py             engine/runtime/experiments/cellular_automata/rule30_077_zero_tail_basin.py             engine/runtime/experiments/cellular_automata/rule30_transform_program.py             engine/runtime/experiments/cellular_automata/tests/test_rule30_transform_program.py

      - name: Execute compiler binding tests
        shell: bash
        run: |
          set -euo pipefail
          cd verification/helix-7ba5a58a
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q             engine/runtime/experiments/cellular_automata/tests/test_rule30_transform_program.py
