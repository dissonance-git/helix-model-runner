name: Helix Model Run 059 - family route structure replication

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-059-family-route-structure-replication.yml'
      - 'run_059_family_route_structure_replication.py'
      - 'run_058_cross_family_compiler_portfolio.py'
      - 'run_039_exact_representation_operators.py'
      - 'run_028_canonical_representation.py'
      - 'run_026_capability_substitution.py'
      - 'offline_reasoning_content_probe.py'
      - 'offline_reasoning_battery.py'
      - 'vendor/helix-f4265344/**'

permissions:
  contents: read

jobs:
  replicate-family-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ACTOR_MODEL: HuggingFaceTB/SmolLM2-360M
      MODEL_REVISION: f8027fd0eaeea54caa13c31d31b9fdc459c38b49
      MODEL_SHA256: 7aaff6661428bed033abba9522bec81938678642cca3181fe752b6ca9e1e540f
      MODEL_BYTES: '723674912'
      HELIX_COMMIT: f42653441213d13ebece11508922fa9e78cd3a25
      HELIX_DIR: ${{ github.workspace }}/vendor/helix-f4265344
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned evaluation stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1

      - name: Verify pinned Helix compiler snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             "$HELIX_DIR/engine/ir/passes.py"             "$HELIX_DIR/engine/kernel/identity.py"             "$HELIX_DIR/engine/kernel/semantics.py"             "$HELIX_DIR/engine/kernel/verification.py"
          test "$(sha256sum "$HELIX_DIR/engine/ir/passes.py" | cut -d' ' -f1)" = "cf30f43483e9cef50ce3760c290c8243d44aacee1e56745b6134494831855e00"

      - name: Verify frozen replication before actor acquisition
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             offline_reasoning_battery.py             offline_reasoning_content_probe.py             run_026_capability_substitution.py             run_028_canonical_representation.py             run_039_exact_representation_operators.py             run_058_cross_family_compiler_portfolio.py             run_059_family_route_structure_replication.py
          python run_059_family_route_structure_replication.py             --helix-dir "$HELIX_DIR"             --self-test | tee run-059-self-test.json

      - name: Restore immutable actor cache
        id: actor-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf/hub/models--HuggingFaceTB--SmolLM2-360M
          key: hf-smollm2-360m-${{ env.MODEL_REVISION }}-${{ env.MODEL_SHA256 }}

      - name: Resolve exact frozen actor remotely
        id: actor
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import os
          snapshot = Path(snapshot_download(
              repo_id=os.environ["ACTOR_MODEL"],
              revision=os.environ["MODEL_REVISION"],
              cache_dir=Path(os.environ["HF_HOME"]) / "hub",
              allow_patterns=["*.json","*.model","*.txt","merges.txt","vocab.json","model.safetensors"],
          ))
          model_file = snapshot / "model.safetensors"
          if model_file.stat().st_size != int(os.environ["MODEL_BYTES"]):
              raise SystemExit("model byte mismatch")
          h=sha256()
          with model_file.open("rb") as handle:
              while chunk:=handle.read(8*1024*1024):
                  h.update(chunk)
          if h.hexdigest()!=os.environ["MODEL_SHA256"]:
              raise SystemExit("model digest mismatch")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"snapshot={snapshot}\n")
              out.write(f"model_bytes={model_file.stat().st_size}\n")
          PY

      - name: Execute structural replication
        shell: bash
        run: |
          set -euo pipefail
          python run_059_family_route_structure_replication.py             --helix-dir "$HELIX_DIR"             --model-dir "${{ steps.actor.outputs.snapshot }}"             --model-file "${{ steps.actor.outputs.snapshot }}/model.safetensors"             --expected-sha256 "$MODEL_SHA256"             --seeds 20261231,20270101             --cases-per-family 4             --output run-059-family-route-structure-replication.json             | tee run-059-family-route-structure-replication.log
          sha256sum run-059-family-route-structure-replication.json

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-059-family-route-structure-replication
          path: |
            run-059-self-test.json
            run-059-family-route-structure-replication.json
            run-059-family-route-structure-replication.log
          if-no-files-found: warn
          retention-days: 14
