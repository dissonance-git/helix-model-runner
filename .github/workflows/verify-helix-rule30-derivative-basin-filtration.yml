name: Verify Helix Rule30 derivative basin filtration

on:
  push:
    paths:
      - '.github/workflows/verify-helix-rule30-derivative-basin-filtration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run exact filtration tests
        shell: bash
        run: |
          set -euo pipefail
          cd verification/helix-ee2bda65
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile             engine/runtime/experiments/cellular_automata/rule30_077_zero_tail_basin.py             engine/runtime/experiments/cellular_automata/rule30_079_dyadic_derivative_filtration.py             engine/runtime/experiments/cellular_automata/rule30_080_derivative_basin_filtration.py             engine/runtime/experiments/cellular_automata/tests/test_rule30_079_dyadic_derivative_filtration.py             engine/runtime/experiments/cellular_automata/tests/test_rule30_080_derivative_basin_filtration.py
          python -m pytest -q             engine/runtime/experiments/cellular_automata/tests/test_rule30_079_dyadic_derivative_filtration.py             engine/runtime/experiments/cellular_automata/tests/test_rule30_080_derivative_basin_filtration.py

      - name: Emit exact receipts
        shell: bash
        run: |
          set -euo pipefail
          cd verification/helix-ee2bda65
          python -m engine.runtime.experiments.cellular_automata.rule30_079_dyadic_derivative_filtration             --output rule30-079-result.json | tee rule30-079.log
          python -m engine.runtime.experiments.cellular_automata.rule30_080_derivative_basin_filtration             --output rule30-080-result.json | tee rule30-080.log
          sha256sum rule30-079-result.json rule30-080-result.json

      - name: Publish verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: rule30-079-080-derivative-filtration
          path: |
            verification/helix-ee2bda65/rule30-079-result.json
            verification/helix-ee2bda65/rule30-080-result.json
            verification/helix-ee2bda65/rule30-079.log
            verification/helix-ee2bda65/rule30-080.log
          retention-days: 14

