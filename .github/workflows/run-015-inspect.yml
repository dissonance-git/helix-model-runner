name: Helix Model Run 015 - inspect Pollard FlyBrain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-015-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install torch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Fetch exact donor artifact in ephemeral VM
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o donor.pt 'https://huggingface.co/PollardWeights/FlyBrain-Pollard-CNSv1/resolve/main/FlyBrain-Pollard-CNSv1.pt?download=true'
          sha256sum donor.pt
          stat -c '%s bytes' donor.pt
      - name: Inspect structure only
        shell: python
        run: |
          import json, traceback, torch
          try:
              b=torch.load('donor.pt', map_location='cpu', weights_only=False)
              print('TYPE', type(b).__name__)
              if isinstance(b, dict):
                  print('TOP_KEYS', [str(x) for x in b.keys()])
                  print('META_REPR', repr(b.get('meta',{})))
                  for k in ('src','dst','w','sign','raw_w','body_id','body_ids','nodes'):
                      if k not in b:
                          continue
                      x=b[k]
                      print('FIELD_BEGIN', k, type(x).__name__)
                      for attr in ('shape','dtype','numel'):
                          try:
                              v=getattr(x,attr)
                              print(' ',attr, v() if callable(v) else v)
                          except Exception as e:
                              print(' ',attr,'ERR',repr(e))
                      try: print(' minmax', float(x.min()), float(x.max()))
                      except Exception as e: print(' minmax ERR',repr(e))
                  print('MODULE_KEYS', [k for k in ('addr','addr_e','val','wgate','out','voice','temp','amix','dbeta') if k in b])
              else:
                  print('VALUE_REPR', repr(b)[:4000])
          except Exception:
              traceback.print_exc()
          print('INSPECTION_DONE')
      - name: Cleanup donor bytes
        if: always()
        run: rm -f donor.pt
