name: Helix Model Run 015 - inspect Pollard FlyBrain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-015-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install torch
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Fetch exact donor artifact in ephemeral VM
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o donor.pt 'https://huggingface.co/PollardWeights/FlyBrain-Pollard-CNSv1/resolve/main/FlyBrain-Pollard-CNSv1.pt?download=true'
      - name: Inspect structure only
        shell: python
        run: |
          import hashlib, json, os, torch
          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for c in iter(lambda:f.read(1<<20),b''): h.update(c)
              return h.hexdigest()
          b=torch.load('donor.pt', map_location='cpu', weights_only=False)
          out={'artifact_bytes':os.path.getsize('donor.pt'),'artifact_sha256':sha256('donor.pt'),'python_type':type(b).__name__}
          if isinstance(b,dict):
              out['top_keys']=[str(x) for x in b.keys()]
              out['meta']={str(k): (v.item() if hasattr(v,'item') and getattr(v,'numel',lambda:2)()==1 else str(v)) for k,v in b.get('meta',{}).items()}
              fields={}
              for k in ('src','dst','w','sign','raw_w','body_id','body_ids','nodes'):
                  if k in b:
                      x=b[k]
                      row={'type':type(x).__name__}
                      if hasattr(x,'shape'): row['shape']=list(x.shape)
                      if hasattr(x,'dtype'): row['dtype']=str(x.dtype)
                      try: row['min']=float(x.min())
                      except Exception: pass
                      try: row['max']=float(x.max())
                      except Exception: pass
                      fields[k]=row
              out['fields']=fields
              out['module_keys']=[k for k in ('addr','addr_e','val','wgate','out','voice','temp','amix','dbeta') if k in b]
          open('pollard-inspection.json','w',encoding='utf-8').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
      - name: Cleanup donor bytes
        if: always()
        run: rm -f donor.pt
      - name: Publish compact inspection only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-015-pollard-inspection-${{ github.run_id }}
          path: pollard-inspection.json
          if-no-files-found: error
          retention-days: 3
