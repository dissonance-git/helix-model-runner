name: Helix Model Run 014 - distinction floor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-014-distinction-floor.yml'

permissions:
  contents: read

jobs:
  distinction-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLYAI_COMMIT: fcf825d1f506db698a84850b005657df6ec8df3c
      FLY_DATA: /tmp/helix-fly-data
      NUMBA_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact frozen donor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 numba==0.61.2
          python -m pip install --disable-pip-version-check --no-deps "git+https://github.com/alextitonis/fly.ai.git@${FLYAI_COMMIT}"

      - name: Build normalized 40ms worker
        shell: python
        run: |
          from pathlib import Path

          source = Path('connectome_temporal_probe.py').read_text(encoding='utf-8')
          replacements = {
              'PROBE_DELAYS_S = (0.0, 0.04, 0.10, 0.20)':
                  'PROBE_DELAYS_S = (0.0, 0.04)',
              'rng = np.random.default_rng(base_seed + int(round(dt * 1e6)) + (rewire_seed or 0))':
                  'rng = np.random.default_rng(base_seed + int(round(dt * 1e6)))',
              'X = np.asarray(by_delay[delay], np.float32)\n        if len(X) != len(y):':
                  'X = np.asarray(by_delay[delay], np.float32)\n        X = X / (np.linalg.norm(X, axis=1, keepdims=True) + 1e-6)\n        if len(X) != len(y):',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'expected frozen source fragment missing: {old[:100]!r}')
              source = source.replace(old, new, 1)
          Path('distinction_effective.py').write_text(source, encoding='utf-8')

      - name: Execute one-state-sample distinction sweep
        shell: python
        run: |
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import numpy as np

          spec = importlib.util.spec_from_file_location('distinction_effective', 'distinction_effective.py')
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)

          ranks = (1, 2, 4, 8, 16)
          captures = []

          def grouped_predictions(X, y, groups, rank):
              predictions = np.empty_like(y)
              for group in np.unique(groups):
                  test = groups == group
                  train = ~test
                  predictions[test] = probe.fit_predict_ridge(
                      X[train], y[train], X[test], rank=rank
                  )
              return predictions

          def capture_accuracy(X, y, groups):
              permuted_y = np.random.default_rng(20260917).permutation(y)
              positive = {}
              negative = {}
              for rank in ranks:
                  pred = grouped_predictions(X, y, groups, rank)
                  neg_pred = grouped_predictions(X, permuted_y, groups, rank)
                  positive[str(rank)] = {
                      'accuracy': float(np.mean(pred == y)),
                      'prediction_sha256': hashlib.sha256(
                          pred.astype(np.int64).tobytes()
                      ).hexdigest(),
                  }
                  negative[str(rank)] = {
                      'accuracy': float(np.mean(neg_pred == permuted_y)),
                      'prediction_sha256': hashlib.sha256(
                          neg_pred.astype(np.int64).tobytes()
                      ).hexdigest(),
                  }
              captures.append({'positive': positive, 'permuted': negative})
              return positive['16']['accuracy']

          probe.grouped_cv_accuracy = capture_accuracy

          rows = []
          for topology, seed in [('real', None)] + [
              (f'rewire-{i+1}', 731 + 10_000 * (i + 1)) for i in range(5)
          ]:
              before = len(captures)
              row = probe.run_condition(
                  dt=0.020,
                  topology=topology,
                  rewire_seed=seed,
                  groups_n=10,
                  batch=8,
                  sketch_width=512,
                  base_seed=731,
              )
              produced = captures[before:]
              if len(produced) != len(probe.PROBE_DELAYS_S):
                  raise RuntimeError(
                      f'capture count mismatch for {topology}: {len(produced)}'
                  )
              for delay, capture in zip(probe.PROBE_DELAYS_S, produced):
                  row['result_by_delay'][str(delay)]['rank_metrics'] = capture
              rows.append(row)

          delay = '0.04'
          real = next(row for row in rows if row['topology'] == 'real')
          rewires = [row for row in rows if row['topology'].startswith('rewire-')]
          positive = []
          negative = []
          for rank in ranks:
              key = str(rank)
              rp = real['result_by_delay'][delay]['rank_metrics']['positive'][key]
              controls = [
                  row['result_by_delay'][delay]['rank_metrics']['positive'][key]['accuracy']
                  for row in rewires
              ]
              rn = real['result_by_delay'][delay]['rank_metrics']['permuted'][key]
              neg_controls = [
                  row['result_by_delay'][delay]['rank_metrics']['permuted'][key]['accuracy']
                  for row in rewires
              ]
              positive.append({
                  'rank': rank,
                  'real_accuracy': rp['accuracy'],
                  'real_prediction_sha256': rp['prediction_sha256'],
                  'rewire_accuracy_mean': float(np.mean(controls)),
                  'rewire_accuracy_max': float(np.max(controls)),
                  'real_beats_all_rewires': bool(rp['accuracy'] > max(controls)),
              })
              negative.append({
                  'rank': rank,
                  'real_accuracy': rn['accuracy'],
                  'rewire_accuracy_mean': float(np.mean(neg_controls)),
                  'rewire_accuracy_max': float(np.max(neg_controls)),
                  'real_beats_all_rewires': bool(rn['accuracy'] > max(neg_controls)),
              })

          reference = next(row for row in positive if row['rank'] == 16)
          exact_floor = next((
              row['rank'] for row in positive
              if row['real_prediction_sha256'] == reference['real_prediction_sha256']
              and row['real_beats_all_rewires'] == reference['real_beats_all_rewires']
          ), None)

          data_dir = Path(os.environ['FLY_DATA'])
          receipt = {
              'schema': 'helix-model-run-014-distinction-floor-v2',
              'status': 'worker-observation-not-authority',
              'question': 'How far can the normalized 40 ms MaleCNS readout be compressed before the protected finite-sample behavior changes?',
              'source_identity': {
                  'flyai_commit': probe.DONOR_COMMIT,
                  'brain_npz_sha256': probe.sha256(data_dir / 'brain.npz'),
                  'weights_npz_sha256': probe.sha256(data_dir / 'weights.npz'),
              },
              'parameters': {
                  'dt': 0.020,
                  'delay_s': 0.04,
                  'groups': 10,
                  'batch': 8,
                  'rewires': 5,
                  'sketch_width': 512,
                  'ranks': list(ranks),
                  'per_sample_l2_normalized': True,
                  'labels_shared_across_topologies': True,
              },
              'protected_behavior': {
                  'reference_rank': 16,
                  'requirements': [
                      'exact grouped-CV prediction vector on the real topology',
                      'whether real topology beats every degree-preserving rewire',
                  ],
              },
              'positive': positive,
              'permuted_label_negative_control': negative,
              'exact_behavior_floor_rank': exact_floor,
              'claim_boundary': 'exploratory mechanism test selected after run 014 localized a transient window; only readout rank is compressed; not the preregistered run 016 endpoint and not a general connectome or ontology claim',
          }
          Path('distinction-floor.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('DISTINCTION_FLOOR ' + json.dumps(receipt, sort_keys=True))

      - name: Remove connectome bytes before retention
        if: always()
        shell: bash
        run: rm -rf "$FLY_DATA" ~/.cache/pip

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-014-distinction-floor-${{ github.run_id }}-${{ github.run_attempt }}
          path: distinction-floor.json
          if-no-files-found: warn
          retention-days: 14
