name: Helix Model Run 014 - MaleCNS community null

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-014-connectome-hierarchy.yml'

permissions:
  contents: read

jobs:
  hierarchy-null:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLYAI_COMMIT: fcf825d1f506db698a84850b005657df6ec8df3c
      MALECNS_COMMIT: 67767d2233657983993ff6c2be48e836a935863c
      FLY_DATA: /tmp/helix-fly-data
      MALECNS_COMMUNITIES: /tmp/mcns_lvl_6_hsbm_communities.feather
      NUMBA_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact frozen donors
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 numba==0.61.2 pandas==2.2.3 pyarrow==17.0.0
          python -m pip install --disable-pip-version-check --no-deps "git+https://github.com/alextitonis/fly.ai.git@${FLYAI_COMMIT}"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/flyconnectome/2025malecns/${MALECNS_COMMIT}/supplemental_data/mcns_lvl_6_hsbm_communities.feather" \
            --output "$MALECNS_COMMUNITIES"
          sha256sum "$MALECNS_COMMUNITIES"

      - name: Build matched normalized probe
        shell: python
        run: |
          from pathlib import Path
          p=Path('connectome_temporal_probe.py')
          text=p.read_text(encoding='utf-8')
          replacements={
            'PROBE_DELAYS_S = (0.0, 0.04, 0.10, 0.20)':
              'PROBE_DELAYS_S = (0.0, 0.02, 0.04, 0.06, 0.08)',
            'rng = np.random.default_rng(base_seed + int(round(dt * 1e6)) + (rewire_seed or 0))':
              'rng = np.random.default_rng(base_seed + int(round(dt * 1e6)))',
            'X = np.asarray(by_delay[delay], np.float32)\n        if len(X) != len(y):':
              'X = np.asarray(by_delay[delay], np.float32)\n        X = X / (np.linalg.norm(X, axis=1, keepdims=True) + 1e-6)\n        if len(X) != len(y):',
            '"readout": "fixed signed-hash internal-spike sketch + fixed PCA16/ridge(lambda=1)",':
              '"readout": "per-sample L2-normalized signed-hash internal-spike sketch + fixed PCA16/ridge(lambda=1)",',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected source fragment not found; refusing silent drift: {old[:80]}')
              text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')

      - name: Freeze effective worker identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum connectome_temporal_probe.py connectome_hierarchy_probe.py "$MALECNS_COMMUNITIES"
          python -m py_compile connectome_temporal_probe.py connectome_hierarchy_probe.py

      - name: Execute 20ms hierarchy discriminator
        shell: bash
        run: |
          set -euo pipefail
          python connectome_hierarchy_probe.py \
            --output connectome-hierarchy-20ms.json \
            --groups 10 \
            --batch 8 \
            --replicates 3 \
            --sketch-width 512 \
            --dts 0.020

      - name: Emit compact hierarchy summary
        shell: python
        run: |
          import json
          d=json.load(open('connectome-hierarchy-20ms.json',encoding='utf-8'))
          print('RUN014_HIERARCHY '+json.dumps({
              'community_null':d['community_null'],
              'summary':d['summary'],
              'rows':[{'topology':r['topology'],'wall_s':r['wall_s'],'rate':r['mean_neuron_firing_hz']} for r in d['rows']],
              'wall_s':d['wall_s'],
          },sort_keys=True))

      - name: Remove connectome bytes before retention
        if: always()
        shell: bash
        run: rm -rf "$FLY_DATA" "$MALECNS_COMMUNITIES" ~/.cache/pip

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-014-connectome-hierarchy-${{ github.run_id }}-${{ github.run_attempt }}
          path: connectome-hierarchy-20ms.json
          if-no-files-found: error
          retention-days: 14
