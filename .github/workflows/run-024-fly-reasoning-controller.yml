name: Helix Model Run 024 - temporal reasoning controller

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-024-fly-reasoning-controller.yml'
      - 'run_024_fly_reasoning_controller.py'
      - 'connectome_open_weight_router.py'
      - 'connectome_temporal_probe.py'
      - 'connectome_hierarchy_probe.py'
      - 'run_032_cross_representation_invariant.py'
      - 'run_028_canonical_representation.py'
      - 'run_026_capability_substitution.py'
      - 'offline_reasoning_battery.py'

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODEL_REVISION: f8027fd0eaeea54caa13c31d31b9fdc459c38b49
      MODEL_SHA256: 7aaff6661428bed033abba9522bec81938678642cca3181fe752b6ca9e1e540f
      MODEL_BYTES: '723674912'
      FLYAI_COMMIT: fcf825d1f506db698a84850b005657df6ec8df3c
      FLY_DATA: /tmp/helix-fly-data
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      NUMBA_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CPU model and fly stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 numba==0.61.2 pandas==2.2.3 pyarrow==17.0.0 transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1
          python -m pip install --disable-pip-version-check --no-deps "git+https://github.com/alextitonis/fly.ai.git@${FLYAI_COMMIT}"

      - name: Verify controller sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile run_024_fly_reasoning_controller.py connectome_open_weight_router.py connectome_temporal_probe.py connectome_hierarchy_probe.py run_032_cross_representation_invariant.py run_028_canonical_representation.py run_026_capability_substitution.py offline_reasoning_battery.py
          sha256sum run_024_fly_reasoning_controller.py connectome_open_weight_router.py connectome_temporal_probe.py connectome_hierarchy_probe.py run_032_cross_representation_invariant.py run_028_canonical_representation.py run_026_capability_substitution.py offline_reasoning_battery.py

      - name: Fetch exact frozen actor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import snapshot_download
          import os
          snapshot_download(
              repo_id='HuggingFaceTB/SmolLM2-360M',
              revision=os.environ['MODEL_REVISION'],
              local_dir='model-src',
              allow_patterns=['*.json','*.model','*.txt','model.safetensors'],
          )
          PY
          test "$(stat -c '%s' model-src/model.safetensors)" = "$MODEL_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" model-src/model.safetensors | sha256sum --check --strict

      - name: Materialize and bind exact MaleCNS bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from flybrain import FlyBrain
          from connectome_temporal_probe import BRAIN_SHA256, WEIGHTS_SHA256, sha256
          FlyBrain(device='cpu', batch=1, seed=24024, dt=0.020, sensory_input=False)
          root=Path(os.environ['FLY_DATA'])
          assert sha256(root/'brain.npz') == BRAIN_SHA256
          assert sha256(root/'weights.npz') == WEIGHTS_SHA256
          print('MALECNS_IDENTITY_OK', (root/'brain.npz').stat().st_size, (root/'weights.npz').stat().st_size)
          PY

      - name: Execute matched-budget temporal controller
        shell: bash
        run: |
          set -euo pipefail
          python run_024_fly_reasoning_controller.py --model-dir model-src --model-file model-src/model.safetensors --expected-sha256 "$MODEL_SHA256" --calibration-seeds 20261028,20261029,20261030 --test-seeds 20261031,20261101 --cases-per-family 8 --output run-024-controller.json | tee run-024-controller.log
          sha256sum run-024-controller.json

      - name: Remove heavyweight bytes before retention
        if: always()
        shell: bash
        run: rm -rf model-src "$FLY_DATA" ~/.cache/huggingface ~/.cache/pip

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-024-temporal-reasoning-controller
          path: |
            run-024-controller.json
            run-024-controller.log
          if-no-files-found: warn
          retention-days: 14
