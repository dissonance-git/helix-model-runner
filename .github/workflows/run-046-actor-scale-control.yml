name: Helix Model Run 046 - actor scale control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-046-actor-scale-control.yml'
      - 'run_046_actor_scale_control.py'

permissions:
  contents: read

jobs:
  scale-control:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ACTOR_MODEL: HuggingFaceTB/SmolLM2-1.7B
      MODEL_REVISION: fc3154c71b5d1223100f74f4ede67eb44374bc27
      MODEL_SHA256: 1193528982f4ac0c0b707ce36fd7dc03a0ef6f3e1a432deb886dce2e90c300c0
      HF_HOME: ${{ runner.temp }}/hf
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore immutable actor cache
        id: actor-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf/hub/models--HuggingFaceTB--SmolLM2-1.7B
          key: hf-smollm2-1.7b-${{ env.MODEL_REVISION }}-${{ env.MODEL_SHA256 }}

      - name: Install pinned evaluation stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1

      - name: Verify scale-control evaluator before actor acquisition
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            offline_reasoning_battery.py \
            offline_reasoning_content_probe.py \
            run_026_capability_substitution.py \
            run_028_canonical_representation.py \
            run_039_exact_representation_operators.py \
            run_046_actor_scale_control.py
          python run_046_actor_scale_control.py --self-test | tee run-046-self-test.json
          sha256sum \
            offline_reasoning_battery.py \
            offline_reasoning_content_probe.py \
            run_026_capability_substitution.py \
            run_028_canonical_representation.py \
            run_039_exact_representation_operators.py \
            run_046_actor_scale_control.py \
            run-046-self-test.json

      - name: Resolve exact frozen actor remotely
        id: actor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import os

          snapshot = Path(snapshot_download(
              repo_id=os.environ["ACTOR_MODEL"],
              revision=os.environ["MODEL_REVISION"],
              cache_dir=Path(os.environ["HF_HOME"]) / "hub",
              allow_patterns=[
                  "*.json",
                  "*.model",
                  "*.txt",
                  "*.json",
                  "merges.txt",
                  "vocab.json",
                  "model.safetensors",
              ],
          ))
          model_file = snapshot / "model.safetensors"
          digest = sha256()
          with model_file.open("rb") as handle:
              while chunk := handle.read(8 * 1024 * 1024):
                  digest.update(chunk)
          observed = digest.hexdigest()
          expected = os.environ["MODEL_SHA256"]
          if observed != expected:
              raise SystemExit(f"model digest mismatch: expected {expected}, observed {observed}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"snapshot={snapshot}\n")
              out.write(f"model_bytes={model_file.stat().st_size}\n")
          print(f"verified actor={os.environ['ACTOR_MODEL']} revision={os.environ['MODEL_REVISION']}")
          print(f"model_bytes={model_file.stat().st_size} sha256={observed}")
          PY

      - name: Record transport receipt
        shell: bash
        env:
          CACHE_HIT: ${{ steps.actor-cache.outputs.cache-hit }}
          MODEL_BYTES: ${{ steps.actor.outputs.model_bytes }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("run-046-transport.json").write_text(
              json.dumps(
                  {
                      "model_residency": "remote-only",
                      "actions_cache_hit": os.environ.get("CACHE_HIT", ""),
                      "model_bytes": int(os.environ["MODEL_BYTES"]),
                      "workstation_download": False,
                      "git_weight_retention": False,
                      "artifact_weight_retention": False,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          cat run-046-transport.json

      - name: Execute paired 1.7B scale probe
        shell: bash
        run: |
          set -euo pipefail
          python run_046_actor_scale_control.py \
            --model-dir "${{ steps.actor.outputs.snapshot }}" \
            --model-file "${{ steps.actor.outputs.snapshot }}/model.safetensors" \
            --expected-sha256 "$MODEL_SHA256" \
            --actor-model "$ACTOR_MODEL" \
            --actor-revision "$MODEL_REVISION" \
            --seeds 20261019,20261020,20261021 \
            --cases-per-family 4 \
            --output run-046-actor-scale-control.json \
            | tee run-046-actor-scale-control.log
          sha256sum run-046-actor-scale-control.json run-046-transport.json

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-046-actor-scale-control
          path: |
            run-046-self-test.json
            run-046-transport.json
            run-046-actor-scale-control.json
            run-046-actor-scale-control.log
          if-no-files-found: warn
          retention-days: 14
