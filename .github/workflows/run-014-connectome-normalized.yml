name: Helix Model Run 014 - normalized MaleCNS temporal geometry

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-014-connectome-normalized.yml'

permissions:
  contents: read

jobs:
  normalized-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLYAI_COMMIT: fcf825d1f506db698a84850b005657df6ec8df3c
      FLY_DATA: /tmp/helix-fly-data
      NUMBA_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact frozen donor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 numba==0.61.2
          python -m pip install --disable-pip-version-check --no-deps "git+https://github.com/alextitonis/fly.ai.git@${FLYAI_COMMIT}"

      - name: Build normalized dense-delay probe from preregistered worker
        shell: python
        run: |
          from pathlib import Path
          p=Path('connectome_temporal_probe.py')
          text=p.read_text(encoding='utf-8')
          replacements={
            'PROBE_DELAYS_S = (0.0, 0.04, 0.10, 0.20)':
              'PROBE_DELAYS_S = (0.0, 0.02, 0.04, 0.06, 0.08, 0.10, 0.12, 0.14, 0.16, 0.18, 0.20)',
            'rng = np.random.default_rng(base_seed + int(round(dt * 1e6)) + (rewire_seed or 0))':
              'rng = np.random.default_rng(base_seed + int(round(dt * 1e6)))',
            'X = np.asarray(by_delay[delay], np.float32)\n        if len(X) != len(y):':
              'X = np.asarray(by_delay[delay], np.float32)\n        # Kill the global-activity/amplitude confound: every trial contributes only direction in state space.\n        X = X / (np.linalg.norm(X, axis=1, keepdims=True) + 1e-6)\n        if len(X) != len(y):',
            '"readout": "fixed signed-hash internal-spike sketch + fixed PCA16/ridge(lambda=1)",':
              '"readout": "per-sample L2-normalized signed-hash internal-spike sketch + fixed PCA16/ridge(lambda=1)",',
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected source fragment not found; refusing silent drift: {old[:80]}')
              text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')

      - name: Freeze effective worker identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, sys
          p=pathlib.Path('connectome_temporal_probe.py')
          print('effective_probe_sha256', hashlib.sha256(p.read_bytes()).hexdigest(), 'bytes', p.stat().st_size)
          print('python', sys.version)
          PY
          python -m py_compile connectome_temporal_probe.py

      - name: Execute normalized dense-delay grid
        shell: bash
        run: |
          set -euo pipefail
          python connectome_temporal_probe.py \
            --output connectome-temporal-normalized.json \
            --groups 10 \
            --batch 8 \
            --rewires 5 \
            --sketch-width 512 \
            --dts 0.020 0.002

      - name: Emit compact normalized summary
        shell: python
        run: |
          import json
          d=json.load(open('connectome-temporal-normalized.json',encoding='utf-8'))
          print('RUN014_NORMALIZED '+json.dumps({
              'primary':d['summary']['primary'],
              'comparisons':d['summary']['comparisons'],
              'rows':[{'dt':r['dt'],'topology':r['topology'],'wall_s':r['wall_s'],'rate':r['mean_neuron_firing_hz']} for r in d['rows']],
          },sort_keys=True))

      - name: Remove connectome bytes before retention
        if: always()
        shell: bash
        run: rm -rf "$FLY_DATA" ~/.cache/pip

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-014-connectome-normalized-${{ github.run_id }}-${{ github.run_attempt }}
          path: connectome-temporal-normalized.json
          if-no-files-found: error
          retention-days: 14
