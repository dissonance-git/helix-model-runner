name: Helix Model Run 019 - routing distinction diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-019-router-distinction.yml'
      - 'router_distinction_diagnostic.py'

permissions:
  contents: read

jobs:
  routing-distinction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_REVISION: f8027fd0eaeea54caa13c31d31b9fdc459c38b49
      MODEL_SHA256: 7aaff6661428bed033abba9522bec81938678642cca3181fe752b6ca9e1e540f
      MODEL_BYTES: '723674912'
      FLYAI_COMMIT: fcf825d1f506db698a84850b005657df6ec8df3c
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      NUMBA_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned model diagnostic stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 numba==0.61.2 pandas==2.2.3 pyarrow==17.0.0 transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1
          python -m pip install --disable-pip-version-check --no-deps "git+https://github.com/alextitonis/fly.ai.git@${FLYAI_COMMIT}"

      - name: Verify diagnostic before model acquisition
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile router_distinction_diagnostic.py connectome_open_weight_router.py connectome_temporal_probe.py connectome_hierarchy_probe.py probe.py
          sha256sum router_distinction_diagnostic.py connectome_open_weight_router.py

      - name: Fetch exact frozen model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import snapshot_download
          import os
          snapshot_download(
              repo_id='HuggingFaceTB/SmolLM2-360M',
              revision=os.environ['MODEL_REVISION'],
              local_dir='model-src',
              allow_patterns=['*.json','*.model','*.txt','model.safetensors'],
          )
          PY
          test "$(stat -c '%s' model-src/model.safetensors)" = "$MODEL_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" model-src/model.safetensors | sha256sum --check --strict

      - name: Execute distinction diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python router_distinction_diagnostic.py \
            --model-dir model-src \
            --model-file model-src/model.safetensors \
            --expected-sha256 "$MODEL_SHA256" \
            --output router-distinction.json | tee router-distinction.log

      - name: Remove model bytes before retention
        if: always()
        shell: bash
        run: rm -rf model-src ~/.cache/huggingface ~/.cache/pip

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-019-router-distinction-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            router-distinction.json
            router-distinction.log
          if-no-files-found: warn
          retention-days: 14
