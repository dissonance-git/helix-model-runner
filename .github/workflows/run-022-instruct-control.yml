name: Helix Model Run 022 - same-scale instruct control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-022-instruct-control.yml'
      - 'offline_reasoning_actor_control.py'

permissions:
  contents: read

jobs:
  instruct-control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_ID: HuggingFaceTB/SmolLM2-360M-Instruct
      MODEL_REVISION: 028493fd3c93bfb0536d0b07a124d8e302e187dd
      MODEL_SHA256: e6bffe7435d7ddc10fd3b9a9efd429dafbacb1cb17015fb5562664e7532bf86e
      MODEL_BYTES: '723674912'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned evaluation stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1

      - name: Verify workers and environment
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile offline_reasoning_battery.py offline_reasoning_content_probe.py offline_reasoning_actor_control.py
          sha256sum offline_reasoning_battery.py offline_reasoning_content_probe.py offline_reasoning_actor_control.py

      - name: Fetch exact instruct control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import snapshot_download
          import os
          snapshot_download(
              repo_id=os.environ['MODEL_ID'],
              revision=os.environ['MODEL_REVISION'],
              local_dir='model-src',
              allow_patterns=['*.json','*.model','*.txt','model.safetensors'],
          )
          PY
          test "$(stat -c '%s' model-src/model.safetensors)" = "$MODEL_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" model-src/model.safetensors | sha256sum --check --strict

      - name: Execute same-scale control
        shell: bash
        run: |
          set -euo pipefail
          python offline_reasoning_actor_control.py             --model-dir model-src             --model-file model-src/model.safetensors             --expected-sha256 "$MODEL_SHA256"             --actor-model "$MODEL_ID"             --actor-revision "$MODEL_REVISION"             --seed 20260917             --cases-per-family 8             --output instruct-control.json | tee instruct-control.log
          sha256sum instruct-control.json
          stat -c 'result_bytes=%s' instruct-control.json

      - name: Remove model bytes before retention
        if: always()
        shell: bash
        run: rm -rf model-src ~/.cache/huggingface ~/.cache/pip

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-022-instruct-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            instruct-control.json
            instruct-control.log
          if-no-files-found: warn
          retention-days: 14
