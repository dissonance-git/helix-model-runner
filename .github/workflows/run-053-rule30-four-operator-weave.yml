name: Helix Model Run 053 - Rule30 four-operator weave

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-053-rule30-four-operator-weave.yml'
      - 'run_053_rule30_four_operator_weave.py'

permissions:
  contents: read

jobs:
  rule30-four-operator-weave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_ID: HuggingFaceTB/SmolLM2-360M-Instruct
      MODEL_REVISION: 028493fd3c93bfb0536d0b07a124d8e302e187dd
      MODEL_SHA256: e6bffe7435d7ddc10fd3b9a9efd429dafbacb1cb17015fb5562664e7532bf86e
      MODEL_BYTES: '723674912'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned evaluation stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1

      - name: Verify frozen experiment before actor acquisition
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile run_053_rule30_four_operator_weave.py
          python run_053_rule30_four_operator_weave.py --self-test | tee run-053-self-test.json
          sha256sum run_053_rule30_four_operator_weave.py run-053-self-test.json

      - name: Restore immutable actor cache
        id: actor-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf/hub/models--HuggingFaceTB--SmolLM2-360M-Instruct
          key: hf-smollm2-360m-instruct-${{ env.MODEL_REVISION }}-${{ env.MODEL_SHA256 }}

      - name: Resolve exact frozen actor remotely
        id: actor
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import os

          snapshot = Path(snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              revision=os.environ["MODEL_REVISION"],
              cache_dir=Path(os.environ["HF_HOME"]) / "hub",
              allow_patterns=[
                  "*.json",
                  "*.model",
                  "*.txt",
                  "merges.txt",
                  "vocab.json",
                  "model.safetensors",
              ],
          ))
          model_file = snapshot / "model.safetensors"
          if model_file.stat().st_size != int(os.environ["MODEL_BYTES"]):
              raise SystemExit("model byte mismatch")
          digest = sha256()
          with model_file.open("rb") as handle:
              while chunk := handle.read(8 * 1024 * 1024):
                  digest.update(chunk)
          observed = digest.hexdigest()
          if observed != os.environ["MODEL_SHA256"]:
              raise SystemExit(f"model digest mismatch: {observed}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"snapshot={snapshot}\n")
              out.write(f"model_bytes={model_file.stat().st_size}\n")
          print(f"verified actor sha256={observed}")
          PY

      - name: Record transport receipt
        shell: bash
        env:
          CACHE_HIT: ${{ steps.actor-cache.outputs.cache-hit }}
          MODEL_BYTES_OBSERVED: ${{ steps.actor.outputs.model_bytes }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("run-053-transport.json").write_text(
              json.dumps({
                  "model_residency": "remote-only",
                  "actions_cache_hit": os.environ.get("CACHE_HIT", ""),
                  "model_bytes": int(os.environ["MODEL_BYTES_OBSERVED"]),
                  "workstation_download": False,
                  "git_weight_retention": False,
                  "artifact_weight_retention": False,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute Rule30 four-operator weave
        shell: bash
        run: |
          set -euo pipefail
          python run_053_rule30_four_operator_weave.py \
            --model-dir "${{ steps.actor.outputs.snapshot }}" \
            --model-file "${{ steps.actor.outputs.snapshot }}/model.safetensors" \
            --expected-sha256 "$MODEL_SHA256" \
            --max-new-tokens 768 \
            --output run-053-rule30-four-operator-weave.json \
            | tee run-053-rule30-four-operator-weave.log
          sha256sum run-053-rule30-four-operator-weave.json run-053-transport.json

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-053-rule30-four-operator-weave
          path: |
            run-053-self-test.json
            run-053-transport.json
            run-053-rule30-four-operator-weave.json
            run-053-rule30-four-operator-weave.log
          if-no-files-found: warn
          retention-days: 14
