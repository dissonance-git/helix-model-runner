name: Helix Model Run 056 - Rule30 compiler choice scale control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-056-rule30-compiler-choice-scale-control.yml'
      - 'run_056_rule30_compiler_choice_scale_control.py'

permissions:
  contents: read

jobs:
  rule30-compiler-choice-scale-control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_ID: HuggingFaceTB/SmolLM2-1.7B-Instruct
      MODEL_REVISION: d1bb90bcfbe0f211109880f4da18da66f229c4f6
      MODEL_SHA256: f55217be716b6a997b97b9d8d7eb6fad02e00858f5010ec24f64603c3a98a0e8
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned evaluation stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1

      - name: Verify frozen scale-control contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile run_056_rule30_compiler_choice_scale_control.py
          python run_056_rule30_compiler_choice_scale_control.py --self-test | tee run-056-self-test.json
          sha256sum run_056_rule30_compiler_choice_scale_control.py run-056-self-test.json

      - name: Restore immutable actor cache
        id: actor-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf/hub/models--HuggingFaceTB--SmolLM2-1.7B-Instruct
          key: hf-smollm2-1.7b-instruct-${{ env.MODEL_REVISION }}-${{ env.MODEL_SHA256 }}

      - name: Resolve exact frozen actor remotely
        id: actor
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import os

          snapshot = Path(snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              revision=os.environ["MODEL_REVISION"],
              cache_dir=Path(os.environ["HF_HOME"]) / "hub",
              allow_patterns=["*.json","*.model","*.txt","merges.txt","vocab.json","model.safetensors"],
          ))
          model_file = snapshot / "model.safetensors"
          digest = sha256()
          with model_file.open("rb") as handle:
              while chunk := handle.read(8 * 1024 * 1024):
                  digest.update(chunk)
          observed = digest.hexdigest()
          if observed != os.environ["MODEL_SHA256"]:
              raise SystemExit(f"model digest mismatch: {observed}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"snapshot={snapshot}\n")
              out.write(f"model_bytes={model_file.stat().st_size}\n")
          print(f"verified actor bytes={model_file.stat().st_size} sha256={observed}")
          PY

      - name: Execute matched scale control
        shell: bash
        run: |
          set -euo pipefail
          python run_056_rule30_compiler_choice_scale_control.py \
            --model-dir "${{ steps.actor.outputs.snapshot }}" \
            --model-file "${{ steps.actor.outputs.snapshot }}/model.safetensors" \
            --expected-sha256 "$MODEL_SHA256" \
            --output run-056-rule30-compiler-choice-scale-control.json \
            | tee run-056-rule30-compiler-choice-scale-control.log
          sha256sum run-056-rule30-compiler-choice-scale-control.json

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-056-rule30-compiler-choice-scale-control
          path: |
            run-056-self-test.json
            run-056-rule30-compiler-choice-scale-control.json
            run-056-rule30-compiler-choice-scale-control.log
          if-no-files-found: warn
          retention-days: 14
