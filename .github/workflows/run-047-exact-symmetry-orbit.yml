name: Helix Model Run 047 - exact symmetry orbit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-047-exact-symmetry-orbit.yml'
      - 'run_047_exact_symmetry_orbit.py'
      - 'run_039_exact_representation_operators.py'
      - 'run_028_canonical_representation.py'
      - 'run_026_capability_substitution.py'
      - 'offline_reasoning_content_probe.py'
      - 'offline_reasoning_battery.py'

permissions:
  contents: read

jobs:
  symmetry-orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ACTOR_MODEL: HuggingFaceTB/SmolLM2-360M
      MODEL_REVISION: f8027fd0eaeea54caa13c31d31b9fdc459c38b49
      MODEL_SHA256: 7aaff6661428bed033abba9522bec81938678642cca3181fe752b6ca9e1e540f
      MODEL_BYTES: '723674912'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned evaluation stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1

      - name: Verify exact-symmetry evaluator before actor acquisition
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            offline_reasoning_battery.py \
            offline_reasoning_content_probe.py \
            run_026_capability_substitution.py \
            run_028_canonical_representation.py \
            run_039_exact_representation_operators.py \
            run_047_exact_symmetry_orbit.py
          python run_047_exact_symmetry_orbit.py --self-test | tee run-047-self-test.json
          sha256sum \
            offline_reasoning_battery.py \
            offline_reasoning_content_probe.py \
            run_026_capability_substitution.py \
            run_028_canonical_representation.py \
            run_039_exact_representation_operators.py \
            run_047_exact_symmetry_orbit.py \
            run-047-self-test.json

      - name: Restore immutable actor cache
        id: actor-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf/hub/models--HuggingFaceTB--SmolLM2-360M
          key: hf-smollm2-360m-${{ env.MODEL_REVISION }}-${{ env.MODEL_SHA256 }}

      - name: Resolve exact frozen actor remotely
        id: actor
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import os

          snapshot = Path(snapshot_download(
              repo_id=os.environ["ACTOR_MODEL"],
              revision=os.environ["MODEL_REVISION"],
              cache_dir=Path(os.environ["HF_HOME"]) / "hub",
              allow_patterns=[
                  "*.json",
                  "*.model",
                  "*.txt",
                  "merges.txt",
                  "vocab.json",
                  "model.safetensors",
              ],
          ))
          model_file = snapshot / "model.safetensors"
          if model_file.stat().st_size != int(os.environ["MODEL_BYTES"]):
              raise SystemExit(
                  f"model byte mismatch: expected {os.environ['MODEL_BYTES']}, "
                  f"observed {model_file.stat().st_size}"
              )
          digest = sha256()
          with model_file.open("rb") as handle:
              while chunk := handle.read(8 * 1024 * 1024):
                  digest.update(chunk)
          observed = digest.hexdigest()
          expected = os.environ["MODEL_SHA256"]
          if observed != expected:
              raise SystemExit(f"model digest mismatch: expected {expected}, observed {observed}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"snapshot={snapshot}\n")
              out.write(f"model_bytes={model_file.stat().st_size}\n")
          print(f"verified actor={os.environ['ACTOR_MODEL']} revision={os.environ['MODEL_REVISION']}")
          print(f"model_bytes={model_file.stat().st_size} sha256={observed}")
          PY

      - name: Record transport receipt
        shell: bash
        env:
          CACHE_HIT: ${{ steps.actor-cache.outputs.cache-hit }}
          MODEL_BYTES_OBSERVED: ${{ steps.actor.outputs.model_bytes }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("run-047-transport.json").write_text(
              json.dumps(
                  {
                      "model_residency": "remote-only",
                      "actions_cache_hit": os.environ.get("CACHE_HIT", ""),
                      "model_bytes": int(os.environ["MODEL_BYTES_OBSERVED"]),
                      "workstation_download": False,
                      "git_weight_retention": False,
                      "artifact_weight_retention": False,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          cat run-047-transport.json

      - name: Execute exact symmetry orbit
        shell: bash
        run: |
          set -euo pipefail
          python run_047_exact_symmetry_orbit.py \
            --model-dir "${{ steps.actor.outputs.snapshot }}" \
            --model-file "${{ steps.actor.outputs.snapshot }}/model.safetensors" \
            --expected-sha256 "$MODEL_SHA256" \
            --seeds 20261112,20261113 \
            --cases-per-family 2 \
            --output run-047-exact-symmetry-orbit.json \
            | tee run-047-exact-symmetry-orbit.log
          sha256sum run-047-exact-symmetry-orbit.json run-047-transport.json

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-047-exact-symmetry-orbit
          path: |
            run-047-self-test.json
            run-047-transport.json
            run-047-exact-symmetry-orbit.json
            run-047-exact-symmetry-orbit.log
          if-no-files-found: warn
          retention-days: 14
