name: Verify Helix donor MCP surface

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-helix-donor-surface.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hash authenticated Helix snapshots
        shell: bash
        run: sha256sum verify/helix-donor/repositories.py verify/helix-donor/local_surface.py verify/helix-donor/test_repository_evidence.py verify/helix-donor/test_mcp_local_surface.py
      - name: Compile changed Python surfaces
        shell: bash
        run: python -m py_compile verify/helix-donor/repositories.py verify/helix-donor/local_surface.py verify/helix-donor/test_repository_evidence.py verify/helix-donor/test_mcp_local_surface.py
