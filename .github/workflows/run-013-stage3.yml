name: Helix Model Run 013 - robustness grid

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-013-stage3.yml'

permissions:
  contents: read

jobs:
  robustness-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_REVISION: f8027fd0eaeea54caa13c31d31b9fdc459c38b49
      MODEL_SHA256: 7aaff6661428bed033abba9522bec81938678642cca3181fe752b6ca9e1e540f
      MODEL_BYTES: '723674912'
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded inference stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install --disable-pip-version-check numpy==2.1.3 transformers==4.56.2 safetensors==0.6.2 huggingface-hub==0.34.4 accelerate==1.10.1

      - name: Freeze execution identities
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          for path in ['probe.py','forward_probe_grid.py','prompts-stage3.json']:
              p=pathlib.Path(path)
              print(path, hashlib.sha256(p.read_bytes()).hexdigest(), p.stat().st_size)
          PY

      - name: Fetch exact pinned model only on ephemeral runner
        shell: python
        run: |
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='HuggingFaceTB/SmolLM2-360M',
              revision='${{ env.MODEL_REVISION }}',
              local_dir='model-src',
              allow_patterns=['*.json','*.model','*.txt','model.safetensors'],
          )

      - name: Verify exact source specimen
        shell: bash
        run: |
          set -euo pipefail
          actual_bytes=$(stat -c '%s' model-src/model.safetensors)
          test "$actual_bytes" = "$MODEL_BYTES"
          printf '%s  %s\n' "$MODEL_SHA256" model-src/model.safetensors | sha256sum --check --strict
          echo "MODEL_IDENTITY_OK bytes=$actual_bytes sha256=$MODEL_SHA256"

      - name: Execute preregistered robustness grid
        shell: bash
        run: |
          set -euo pipefail
          python forward_probe_grid.py \
            --model-dir model-src \
            --model-file model-src/model.safetensors \
            --expected-sha256 "$MODEL_SHA256" \
            --prompts prompts-stage3.json \
            --output receipt-stage3.json

      - name: Emit compact KL summary
        shell: python
        run: |
          import json
          from collections import defaultdict
          d=json.load(open('receipt-stage3.json',encoding='utf-8'))
          groups=defaultdict(dict)
          for row in d['results']:
              groups[(row['layer'],row['residual_fraction'])][row['arm']]=row['metrics']
          wins=defaultdict(int); hel_mag=0; hel_uni=0; summary=[]
          for (layer,budget),arms in sorted(groups.items()):
              scores={name:m['kl_baseline_to_candidate'] for name,m in arms.items()}
              winner=min(scores,key=scores.get); wins[winner]+=1
              hm=scores['multiscale-coverage-residual'] < scores['magnitude-residual']
              hu=scores['multiscale-coverage-residual'] < scores['uniform-block-coverage-residual']
              hel_mag += int(hm); hel_uni += int(hu)
              summary.append({'layer':layer,'budget':budget,'winner':winner,'kl':scores,'helix_beats_magnitude':hm,'helix_beats_uniform':hu})
          aggregate={
            'cells':len(groups),
            'winner_counts':dict(wins),
            'helix_beats_magnitude_cells':hel_mag,
            'helix_beats_uniform_cells':hel_uni,
            'mean_kl_by_arm':{arm:sum(m[arm]['kl_baseline_to_candidate'] for m in groups.values())/len(groups) for arm in ['magnitude-residual','uniform-block-coverage-residual','multiscale-coverage-residual']}
          }
          print('RUN013_STAGE3 '+json.dumps(aggregate,sort_keys=True))
          with open('summary-stage3.json','w',encoding='utf-8') as f:
              json.dump({'aggregate':aggregate,'cells':summary},f,indent=2,sort_keys=True)

      - name: Remove all model bytes before retention
        if: always()
        run: rm -rf model-src ~/.cache/huggingface

      - name: Publish compact evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-013-stage-3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            receipt-stage3.json
            summary-stage3.json
          if-no-files-found: error
          retention-days: 14
